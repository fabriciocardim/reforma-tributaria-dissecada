# Publica o site no GitHub Pages: gera as páginas em site/ e publica. Roda a cada push na main,
# depois de cada captura das normas e sob demanda.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Captura das normas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Testar
        run: npm test
      - name: Gerar as páginas
        run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: implantacao
        uses: actions/deploy-pages@v4
